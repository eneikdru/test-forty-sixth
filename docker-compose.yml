
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  backup:
    image: alpine:3.18
    container_name: backup-service
    volumes:
      - ./data:/data:ro
      - ./backup-storage:/backup-storage
      - ./infrastructure/backup.sh:/usr/local/bin/backup.sh:ro
    environment:
      - SOURCE_DATA_DIR=/data
      - SECURE_STORAGE_DIR=/backup-storage
    # Run the daily schedule using cron
    command: >
      /bin/sh -c "
      apk add --no-cache bash tar &&
      echo '0 0 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root &&
      echo '[INFO] Cron scheduler started for daily backups' &&
      crond -f -d 8
      "
