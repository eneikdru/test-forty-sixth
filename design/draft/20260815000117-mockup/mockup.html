<body class="min-h-screen flex flex-col items-center justify-start md:justify-center px-container-padding pt-20 md:pt-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex items-center justify-between px-container-padding h-16 w-full max-w-lg mx-auto bg-surface dark:bg-surface z-50">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-2 active:opacity-70 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary text-center flex-1">Account Recovery</h1>
<button class="text-primary font-label-bold text-label-bold hover:bg-surface-container-low transition-colors px-3 py-2 rounded active:opacity-70">Help</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[448px] bg-surface-container-lowest rounded-xl p-container-padding shadow-sm border border-surface-container-low mt-8 md:mt-0">
<div class="flex flex-col gap-stack-gap-md">
<!-- Header Section -->
<div class="text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Enter verification code</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">We sent a 6-digit code to your email.</p>
</div>
<!-- Verification Form -->
<form class="flex flex-col gap-stack-gap-lg mt-4" onsubmit="event.preventDefault();">
<!-- OTP Inputs Area -->
<div class="flex flex-col items-center gap-2 w-full">
<label class="sr-only">6-digit verification code</label>
<div class="flex justify-between w-full max-w-[320px] gap-2">
<!-- Simulated Error State for the first few inputs to demonstrate -->
<input class="otp-input error w-12 h-14 text-center font-headline-md text-headline-md rounded border border-error bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="4"/>
<input class="otp-input error w-12 h-14 text-center font-headline-md text-headline-md rounded border border-error bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="2"/>
<input class="otp-input error w-12 h-14 text-center font-headline-md text-headline-md rounded border border-error bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="7"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md rounded border border-outline bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md rounded border border-outline bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md rounded border border-outline bg-surface text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Error Message -->
<div class="flex items-center gap-1 text-error mt-2 w-full max-w-[320px] justify-start">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
<span class="font-label-sm text-label-sm">Invalid code. Please try again.</span>
</div>
</div>
<!-- Resend Action -->
<div class="text-center w-full">
<button class="font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors bg-transparent border-none cursor-pointer" type="button">
                        Resend code
                    </button>
</div>
<!-- Primary Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-bold text-label-bold rounded-full uppercase tracking-wide hover:bg-on-primary-fixed-variant active:bg-on-primary-fixed transition-colors flex items-center justify-center" type="submit">
                    Verify
                </button>
</form>
</div>
</main>
<!-- Script for OTP input auto-advance (lightweight interaction) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value.length === 0) {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
            });
        });
    </script>
