<style>
        body {
            background-color: #f8fafc; /* Slate 50 */
            color: #334155; /* Slate 700 */
        }
        
        .search-input-wrapper:focus-within {
            border-color: #0050cb;
            box-shadow: 0 0 0 2px rgba(0, 80, 203, 0.2);
        }

        .chip-active {
            background-color: #0050cb;
            color: white;
        }

        .chip-inactive {
            background-color: #f1f5f9; /* Slate 100 */
            color: #334155; /* Slate 700 */
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-14 pb-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-container border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-mobile h-14 w-full">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-primary dark:text-inverse-primary text-center flex-1">Search Documents</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg flex flex-col gap-stack-lg">
<!-- Search Input Area -->
<section aria-label="Search Input">
<div class="search-input-wrapper relative flex items-center w-full h-[56px] bg-white border border-outline-variant rounded-lg transition-all duration-200">
<span class="material-symbols-outlined text-outline ml-4" data-icon="search">search</span>
<input autofocus="" class="flex-1 h-full bg-transparent border-none focus:ring-0 px-4 font-body-lg text-on-surface placeholder-outline-variant" placeholder="Find files, folders, or people..." type="text"/>
<button aria-label="Clear search" class="mr-4 text-outline hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
</button>
</div>
</section>
<!-- Recent Searches (Chips) -->
<section aria-label="Recent Searches" class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-outline uppercase tracking-wider">Recent Searches</h2>
<div class="flex flex-wrap gap-2">
<button class="chip-inactive hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-body-md flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="history">history</span>
                    Project Alpha
                </button>
<button class="chip-inactive hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-body-md flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="history">history</span>
                    Invoices 2023
                </button>
<button class="chip-inactive hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-body-md flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="history">history</span>
                    Q3 Report Drafts
                </button>
<button class="chip-inactive hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-body-md flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="history">history</span>
                    Meeting Notes
                </button>
</div>
</section>
<!-- Suggested Categories / Quick Filters -->
<section aria-label="Suggested Categories" class="flex flex-col gap-stack-sm mt-stack-md">
<h2 class="font-label-md text-label-md text-outline uppercase tracking-wider">Refine By Type</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-unit">
<!-- PDF Card -->
<div class="bg-white border border-outline-variant/50 p-4 rounded-lg flex items-start gap-3 hover:shadow-[0px_4px_12px_rgba(15,23,42,0.08)] transition-shadow cursor-pointer group">
<div class="p-2 bg-error-container text-on-error-container rounded-md group-hover:bg-error group-hover:text-on-error transition-colors">
<span class="material-symbols-outlined" data-icon="picture_as_pdf">picture_as_pdf</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface text-base leading-tight">PDFs</p>
<p class="font-label-sm text-label-sm text-outline mt-1">Documents &amp; Forms</p>
</div>
</div>
<!-- Spreadsheets Card -->
<div class="bg-white border border-outline-variant/50 p-4 rounded-lg flex items-start gap-3 hover:shadow-[0px_4px_12px_rgba(15,23,42,0.08)] transition-shadow cursor-pointer group">
<div class="p-2 bg-[#dcfce7] text-[#166534] rounded-md group-hover:bg-[#166534] group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="table">table</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface text-base leading-tight">Sheets</p>
<p class="font-label-sm text-label-sm text-outline mt-1">Data &amp; Finance</p>
</div>
</div>
<!-- Presentations Card -->
<div class="bg-white border border-outline-variant/50 p-4 rounded-lg flex items-start gap-3 hover:shadow-[0px_4px_12px_rgba(15,23,42,0.08)] transition-shadow cursor-pointer group">
<div class="p-2 bg-[#fef08a] text-[#854d0e] rounded-md group-hover:bg-[#ca8a04] group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="slideshow">slideshow</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface text-base leading-tight">Decks</p>
<p class="font-label-sm text-label-sm text-outline mt-1">Presentations</p>
</div>
</div>
<!-- Images Card -->
<div class="bg-white border border-outline-variant/50 p-4 rounded-lg flex items-start gap-3 hover:shadow-[0px_4px_12px_rgba(15,23,42,0.08)] transition-shadow cursor-pointer group">
<div class="p-2 bg-primary-fixed text-on-primary-fixed rounded-md group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="image">image</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface text-base leading-tight">Images</p>
<p class="font-label-sm text-label-sm text-outline mt-1">Assets &amp; Media</p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-16 px-2 pb-safe bg-surface dark:bg-surface-container border-t border-outline-variant dark:border-outline z-50">
<!-- Recent -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:bg-surface-variant dark:hover:bg-on-tertiary-fixed-variant transition-colors active:scale-90 transition-transform p-2 rounded-lg flex-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-md text-label-md">Recent</span>
</a>
<!-- Search (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-4 py-1 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="search" data-weight="fill" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-md text-label-md font-semibold">Search</span>
</a>
<!-- Shared -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:bg-surface-variant dark:hover:bg-on-tertiary-fixed-variant transition-colors active:scale-90 transition-transform p-2 rounded-lg flex-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-md text-label-md">Shared</span>
</a>
<!-- Files -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-fixed-variant hover:bg-surface-variant dark:hover:bg-on-tertiary-fixed-variant transition-colors active:scale-90 transition-transform p-2 rounded-lg flex-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="folder">folder</span>
<span class="font-label-md text-label-md">Files</span>
</a>
</nav>
</body></html>
