openapi: 3.0.3
info:
  title: Search & Epidemiological Materials API Contract
  description: Shared API contract for searching epidemiological materials, applying filters, retrieving material details, and download links.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.epidemiology.example.com
    description: Production API server
security: []
paths:
  /api/v1/materials/search:
    get:
      summary: Search epidemiological materials
      description: Search materials by keyword and filter by pathogen type with pagination and sorting.
      operationId: searchMaterials
      security: []
      parameters:
        - name: query
          in: query
          required: false
          description: Search keyword matching material title or content.
          schema:
            type: string
            example: outbreak
        - name: pathogenType
          in: query
          required: false
          description: Filter materials by pathogen type.
          schema:
            type: string
            enum: [VIRUS, BACTERIA, PARASITE, FUNGI, OTHER]
            example: VIRUS
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Number of records per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: sort
          in: query
          required: false
          description: Sorting criterion in format 'field,asc|desc'.
          schema:
            type: string
            default: createdAt,desc
            example: createdAt,desc
      responses:
        '200':
          description: Successfully retrieved paginated material search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPaginatedResponse'
        '400':
          description: Invalid query, filter, or pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during search execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/materials/{id}:
    get:
      summary: Get epidemiological material details
      description: Retrieve full material details including pathogen classification, content, metadata, and document download URL.
      operationId: getMaterialById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the material.
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '200':
          description: Material details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '400':
          description: Invalid material ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Material not found with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error while fetching material details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MaterialSummary:
      type: object
      required:
        - id
        - title
        - pathogenType
        - createdAt
        - downloadUrl
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the epidemiological material.
          example: 101
        title:
          type: string
          description: Title of the material.
          example: Influenza Surveillance Protocol 2026
        pathogenType:
          type: string
          description: Pathogen classification category.
          example: VIRUS
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the material was created or cataloged.
          example: '2026-08-14T23:52:20Z'
        downloadUrl:
          type: string
          format: uri
          description: Direct download URL for the attached document file.
          example: https://api.epidemiology.example.com/api/v1/materials/101/download

    MaterialDetail:
      type: object
      required:
        - id
        - title
        - pathogenType
        - content
        - createdAt
        - downloadUrl
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the epidemiological material.
          example: 101
        title:
          type: string
          description: Title of the material.
          example: Influenza Surveillance Protocol 2026
        pathogenType:
          type: string
          description: Pathogen classification category.
          example: VIRUS
        content:
          type: string
          description: Full body content or summary protocol text of the material.
          example: Guidance on seasonal influenza monitoring and reporting protocols.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the material was created.
          example: '2026-08-14T23:52:20Z'
        downloadUrl:
          type: string
          format: uri
          description: Direct download URL for downloading the material document file.
          example: https://api.epidemiology.example.com/api/v1/materials/101/download

    SearchPaginatedResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          description: List of material summaries matching search criteria.
          items:
            $ref: '#/components/schemas/MaterialSummary'
        page:
          type: integer
          description: Current page number (0-indexed).
          example: 0
        size:
          type: integer
          description: Page size.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of records matching query.
          example: 42
        totalPages:
          type: integer
          description: Total number of pages available.
          example: 3
        first:
          type: boolean
          description: Indicates whether this is the first page.
          example: true
        last:
          type: boolean
          description: Indicates whether this is the last page.
          example: false

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Application error code.
          example: INVALID_SEARCH_FILTER
        message:
          type: string
          description: Human-readable error message.
          example: The provided pathogen type filter is invalid.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of when the error occurred.
          example: '2026-08-15T00:25:00Z'
        details:
          type: array
          items:
            type: string
          description: Detailed field-level validation errors or context.
          example:
            - "pathogenType must be one of: VIRUS, BACTERIA, PARASITE, FUNGI, OTHER"
